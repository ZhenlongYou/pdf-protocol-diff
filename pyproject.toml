[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-pdf-diff"
version = "1.0.0"
description = "Compare old/new protocol PDFs and report chapter or section-level changes."
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.11.0",
    "Pillow>=12.0.0",
    "opencv-python-headless>=5.0.0",
    "pytesseract>=0.3.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
