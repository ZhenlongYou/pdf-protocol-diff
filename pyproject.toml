[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-pdf-diff"
version = "1.4.0"
description = "Compare old/new protocol PDFs and report chapter or section-level changes."
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.11.0",
    "Pillow>=12.0.0",
    "opencv-python-headless>=5.0.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = ["coverage>=7.0"]
layout = ["docling>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
