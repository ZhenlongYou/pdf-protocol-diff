name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main, project/pdf-protocol-diff]
    paths:
      - "gui_app.py"
      - "main.py"
      - "build_desktop.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "src/protocol_pdf_diff/**"
      - "tests/**"
      - "scripts/capture_windows_ui.ps1"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    paths:
      - "gui_app.py"
      - "main.py"
      - "build_desktop.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "src/protocol_pdf_diff/**"
      - "tests/**"
      - "scripts/capture_windows_ui.ps1"
      - ".github/workflows/build-desktop.yml"

env:
  # Reports and fixtures are UTF-8. Keep Windows test discovery on the same
  # encoding as macOS/Linux instead of the runner's legacy cp1252 locale.
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build macOS desktop artifact
        if: runner.os == 'macOS'
        run: python build_desktop.py --clean

      - name: Build Windows desktop artifact and native renderer probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $env:PROTOCOL_DIFF_RENDERER_PROBE_PATH = (Resolve-Path artifacts).Path + "\windows-renderer-probe.json"
          python build_desktop.py --clean

      - name: Capture Windows WebView2 UI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/capture_windows_ui.ps1 -Executable ./dist/ProtocolPdfDiff/ProtocolPdfDiff.exe -OutputPath ./artifacts/windows-webview2.png -ProbePath ./artifacts/windows-renderer-probe.json

      - name: Build Windows onefile artifact and smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Keep the existing onedir native UI gate and smoke the all-in-one
          # artifact after it; argument order preserves the workflow contract
          # that identifies the onedir command above.
          python build_desktop.py --onefile --clean
          .\dist\ProtocolPdfDiff.exe --smoke-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProtocolPdfDiff-${{ matrix.os }}
          path: |
            dist/**
            artifacts/**
