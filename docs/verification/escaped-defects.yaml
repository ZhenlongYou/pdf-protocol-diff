schema_version: 1
scope_statement: "Long PDF execution and cancellation; source identity, region ownership and occurrence matching; page-window content fidelity; truthful visual coverage; readable report evidence with no source-image upscaling."
escaped_defects:
  - id: DEF-PAGE-WINDOW-TABLE-WRAPPER-20260925
    acceptance_id: REQ-PAGE-WINDOW-CONTENT-FIDELITY
    user_symptom: "PCIe Base 6.4/6.5 short-window reports showed ordinary page prose as deleted and added tables, so the compared content was misleading."
    discovered_via: user_counterexample
    failure_mechanism: "A page-filling one-column pdfplumber candidate captured most native page text and was published as a table despite having no caption or structured columns."
    red_green_pair_id: PAIR-PAGE-WINDOW-TABLE-WRAPPER
    regression_test_id: FULL_PAGE_SINGLE_COLUMN_CAPTURE_TEST
    public_path_rerun_id: RUN-BASE-WINDOW-REAL
    state: verified
  - id: DEF-PAGE-WINDOW-FORUM-FOOTER-OVERFILTER-20260925
    acceptance_id: REQ-PAGE-WINDOW-CONTENT-FIDELITY
    user_symptom: "A changed bottom-of-page technical line containing Forum and Clause text could be treated as publication footer and disappear from the comparison."
    discovered_via: independent_review
    failure_mechanism: "A broad bottom-position Forum/Clause marker granted footer deletion authority without a page folio or repeated footer geometry; page-local folio removal also accepted measurement-bearing voltage and baud-rate text."
    red_green_pair_id: PAIR-BOTTOM-FORUM-CLAUSE-TECHNICAL-LINE
    regression_test_id: BOTTOM_FORUM_CLAUSE_TECHNICAL_LINE_RETAINED_TEST
    public_path_rerun_id: RUN-FOOTER-REAL
    state: verified
  - id: DEF-PAGE-WINDOW-URL-FOOTER-CLUSTER-OVERFILTER-20260925
    acceptance_id: REQ-PAGE-WINDOW-CONTENT-FIDELITY
    user_symptom: "A bottom technical value close to a Forum/Clause footer marker and URL could still disappear from a short-window comparison."
    discovered_via: independent_review
    failure_mechanism: "Page-local footer clustering selected tightly spaced marker-to-URL lines without checking for technical values elsewhere in the cluster."
    red_green_pair_id: PAIR-URL-FOOTER-CLUSTER-TECHNICAL-VALUE
    regression_test_id: FORUM_CLAUSE_URL_CLUSTER_VALUE_PRESERVED_TEST
    public_path_rerun_id: RUN-FOOTER-REAL
    state: verified
  - id: DEF-PLOT-AXIS-20260910
    acceptance_id: REQ-PLOT-AXIS
    user_symptom: "曲线图 Frequency (GHz) 横轴碎片被当作跨页续表，报告错误删除行。"
    discovered_via: user_counterexample
    failure_mechanism: "字体边框形成伪网格，既有图形过滤依赖文字连接，未识别大绘图区与双轴刻度归属。"
    red_green_pair_id: PAIR-PLOT-AXIS
    regression_test_id: PLOT_AXIS_TEST
    public_path_rerun_id: RUN-PLOT-REAL
    state: verified
  - id: DEF-SCREENSHOT-FIRST-20260910
    acceptance_id: REQ-SCREENSHOT-FIRST
    user_symptom: "报告短差异仍是纯文字，相似度1.000占据主清单，表格截图过小无法理解。"
    discovered_via: user_counterexample
    failure_mechanism: "500字符截图门槛、文字优先布局、未分离显示分数附录及检测bbox与展示视口。"
    red_green_pair_id: PAIR-SCREENSHOT-FIRST
    regression_test_id: SCREENSHOT_FIRST_TEST
    public_path_rerun_id: RUN-SCREENSHOT-REAL
    state: verified
  - id: DEF-CONTENT-ONLY-20260909
    acceptance_id: REQ-CONTENT-ONLY
    user_symptom: "大小写、空格、作者、邮箱、目录与无实际内容变化的表格归属提示产生无价值差异。"
    discovered_via: user_counterexample
    failure_mechanism: "章节元数据分类不全，目录条目被解析为正文，排版等价和表格质量告警没有与内容差异分开。"
    red_green_pair_id: PAIR-CONTENT-ONLY
    regression_test_id: CONTENT_ONLY_TEST
    public_path_rerun_id: RUN-CONTENT-REAL
    state: verified
  - id: DEF-VISUAL-MASK-001
    acceptance_id: REQ-VISUAL-MASK-001
    user_symptom: "A page with distant color changes was shown with one large red rectangle spanning unchanged table content."
    discovered_via: user_counterexample
    failure_mechanism: "The preview painted the union bounding box used for cropping onto the image itself."
    red_green_pair_id: PAIR-VISUAL-MASK-001
    regression_test_id: VISUAL_MASK_SCOPE_TEST
    public_path_rerun_id: RUN-VISUAL-MASK-REAL
    state: verified
  - id: DEF-VISUAL-REVIEW-SCALE-002
    acceptance_id: REQ-VISUAL-REVIEW-SCALE-002
    user_symptom: "Visual-review source crops and the difference mask were enlarged until table text appeared abnormally huge."
    discovered_via: user_counterexample
    failure_mechanism: "The shared table-shot rule forced every image to width 100%, including small visual-only evidence crops."
    red_green_pair_id: PAIR-VISUAL-REVIEW-SCALE-002
    regression_test_id: VISUAL_REVIEW_LAYOUT_TEST
    public_path_rerun_id: RUN-VISUAL-REVIEW-REAL
    state: verified
  - id: DEF-VISUAL-REVIEW-CROP-003
    acceptance_id: REQ-VISUAL-REVIEW-CROP-003
    user_symptom: "A table change in a right-side value column produced a partial screenshot with the left-side row context missing."
    discovered_via: user_counterexample
    failure_mechanism: "The visual watchdog expanded the changed-pixel union box on both axes, so right-side changes cropped away the table's left columns."
    red_green_pair_id: PAIR-VISUAL-REVIEW-CROP-003
    regression_test_id: VISUAL_REVIEW_LAYOUT_TEST
    public_path_rerun_id: RUN-VISUAL-REVIEW-REAL
    state: verified
  - id: DEF-VISUAL-REVIEW-DISCLOSURE-004
    acceptance_id: REQ-VISUAL-REVIEW-DISCLOSURE-004
    user_symptom: "A pixel-level diagnostic mask appeared as prominent reader content even though it is technical audit evidence."
    discovered_via: user_usability_review
    failure_mechanism: "The report rendered the mask as an always-visible full card without a reader-facing explanation of its limited meaning."
    red_green_pair_id: PAIR-VISUAL-REVIEW-DISCLOSURE-004
    regression_test_id: VISUAL_REVIEW_LAYOUT_TEST
    public_path_rerun_id: RUN-VISUAL-REVIEW-REAL
    state: verified
  - id: DEF-LONG-NUMBERS
    acceptance_id: REQ-LONG-PDF-PERFORMANCE-005
    user_symptom: "907-page comparison reportedly ran 89 minutes without a result and could not be stopped. Original document unavailable; OIF CEI 5.2/5.3 used for local audit."
    discovered_via: user_performance_report_and_local_reproduction
    failure_mechanism: "Repeated full-stream normalization for each ordinary token."
    red_green_pair_id: PAIR-LONG-NUMBERS
    regression_test_id: LONG_PDF_BEHAVIOR_TEST
    public_path_rerun_id: RUN-LONG-REAL
    state: verified
  - id: DEF-LONG-LCS
    acceptance_id: REQ-LONG-PDF-PERFORMANCE-005
    user_symptom: "907-page comparison reportedly ran 89 minutes without a result and could not be stopped. Original document unavailable; OIF CEI 5.2/5.3 used for local audit."
    discovered_via: user_performance_report_and_local_reproduction
    failure_mechanism: "Hexadecimal identifier signatures inflate semantic keys and trigger very expensive full string alignment."
    red_green_pair_id: PAIR-LONG-LCS
    regression_test_id: LONG_PDF_BEHAVIOR_TEST
    public_path_rerun_id: RUN-LONG-REAL
    state: verified
  - id: DEF-LONG-OCR
    acceptance_id: REQ-LONG-PDF-PERFORMANCE-005
    user_symptom: "907-page comparison reportedly ran 89 minutes without a result and could not be stopped. Original document unavailable; OIF CEI 5.2/5.3 used for local audit."
    discovered_via: user_performance_report_and_local_reproduction
    failure_mechanism: "Table OCR had no finite timeout."
    red_green_pair_id: PAIR-LONG-OCR
    regression_test_id: LONG_PDF_BEHAVIOR_TEST
    public_path_rerun_id: RUN-LONG-REAL
    state: verified
  - id: DEF-LONG-CANCEL
    acceptance_id: REQ-DESKTOP-CANCEL-006
    user_symptom: "907-page comparison reportedly ran 89 minutes without a result and could not be stopped. Original document unavailable; OIF CEI 5.2/5.3 used for local audit."
    discovered_via: user_performance_report_and_local_reproduction
    failure_mechanism: "Desktop comparison ran in a non-cancellable thread and had no stop control."
    red_green_pair_id: PAIR-LONG-CANCEL
    regression_test_id: LONG_PDF_BEHAVIOR_TEST
    public_path_rerun_id: RUN-LONG-REAL
    state: verified
  - id: DEF-LONG-SAM
    acceptance_id: REQ-LONG-PDF-PERFORMANCE-005
    user_symptom: "Full OIF comparison still spent many minutes aligning expanded repetitive semantic keys after threshold filtering."
    discovered_via: real_full_document_profile
    failure_mechanism: "Accepted replacement candidates require exact scores; difflib longest-substring scans degenerate on long repetitive strings."
    red_green_pair_id: PAIR-LONG-SAM
    regression_test_id: LONG_PDF_BEHAVIOR_TEST
    public_path_rerun_id: RUN-LONG-REAL
    state: verified
  - id: DEF-LONG-CLEANUP
    acceptance_id: REQ-LONG-PDF-PERFORMANCE-005
    user_symptom: "Full OIF report generation repeatedly cleaned the same coordinate-owned table text for visible and audit views."
    discovered_via: real_full_document_profile
    failure_mechanism: "Unconsumed Figure prose-boundary scans ran on the Table-only path; pure canonicalization and prefix/suffix results were recomputed."
    red_green_pair_id: PAIR-LONG-CLEANUP
    regression_test_id: LONG_PDF_BEHAVIOR_TEST
    public_path_rerun_id: RUN-LONG-REAL
    state: verified
  - id: DEF-OIF-SOURCE-SCALE
    acceptance_id: REQ-OIF-SOURCE-SCALE
    user_symptom: "OIF p561 HCB 72x72 image is stretched across a report card."
    discovered_via: user_counterexample_20260907
    failure_mechanism: "Shared table-shot width 100 percent enlarges small source crops."
    red_green_pair_id: PAIR-STABLE-SCALE
    regression_test_id: STABLE_PROBE_TEST::scale
    public_path_rerun_id: RUN-FINAL-OIF-NATIVE-REPORT
    state: verified
  - id: DEF-OIF-STRUCTURE-MATCH
    acceptance_id: REQ-OIF-STRUCTURE-MATCH
    user_symptom: "Both versions contain p351-352 and p381 text but report claims addition/deletion."
    discovered_via: user_counterexample_20260907
    failure_mechanism: "Weak heading contaminates hierarchy; unmatched becomes confirmed added/deleted without uncertainty propagation."
    red_green_pair_id: PAIR-STABLE-GLYPH
    regression_test_id: STABLE_PROBE_TEST::glyph
    public_path_rerun_id: RUN-FINAL-OIF-NATIVE-REPORT
    state: verified
  - id: DEF-OIF-REGION-OWNERSHIP
    acceptance_id: REQ-OIF-REGION-OWNERSHIP
    user_symptom: "Old p550 table appears as 16 strips; p382 line numbers and blank space are highlighted."
    discovered_via: user_counterexample_20260907
    failure_mechanism: "Ambiguous page furniture becomes prose evidence; crop expansion crosses another region owner. Corrected source ownership removes the false prose markup. Pages without safe pixel pairing remain explicitly unverified with physical page numbers and causes; p382 pixel equality is not certified."
    red_green_pair_id: PAIR-STABLE-CROP
    regression_test_id: STABLE_PROBE_TEST::crop
    public_path_rerun_id: RUN-FINAL-OIF-NATIVE-REPORT
    state: verified
  - id: DEF-OIF-FIGURE-AS-TABLE
    acceptance_id: REQ-OIF-FIGURE-AS-TABLE
    user_symptom: "HCB exists in both versions but is reported as a removed table."
    discovered_via: user_counterexample_20260907
    failure_mechanism: "Asymmetric figure/table classification is treated as semantic absence."
    red_green_pair_id: PAIR-STABLE-FIGURE
    regression_test_id: STABLE_PROBE_TEST::figure
    public_path_rerun_id: RUN-FINAL-OIF-NATIVE-REPORT
    state: verified
  - id: DEF-READER-FOCUS
    acceptance_id: REQ-READER-FOCUS-CONSERVATION
    user_symptom: "Paired source screenshots still require users to find most differences manually; insufficient review-effort reduction."
    discovered_via: user_usability_review_20260908
    failure_mechanism: "Count-only summaries, collapsed literal evidence and table row truncation leave change discovery to the reader."
    red_green_pair_id: PAIR-READER-DISPLAY
    regression_test_id: READER_TEST::display
    public_path_rerun_id: RUN-READER-NATIVE-REPORT
    state: verified
