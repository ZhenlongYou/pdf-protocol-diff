schema_version: 1
scope_statement: "Long PDF execution and cancellation; source identity, region ownership and occurrence matching; page-window content fidelity; truthful visual coverage; readable report evidence with no source-image upscaling."
escaped_defects:
  - id: DEF-READER-PAGE-GROUP-SOURCE-SYMMETRY-20260917
    acceptance_id: REQ-CONTENT-CORRESPONDENCE
    user_symptom: "同一页面组中的旧版和新版内容被卡片级截图去重拆开，后续差异卡只剩单侧截图，无法直接完成新旧对比。"
    discovered_via: user_counterexample
    failure_mechanism: "来源图片在差异卡内部做全局复用，复用项只保留隐藏别名；页面组兜底只补缺页，不能把已被卡片占用的旧/新版来源重新组成对称的页面级截图对。"
    red_green_pair_id: PAIR-READER-PAGE-GROUP-SOURCE-SYMMETRY
    regression_test_id: READER_PAGE_GROUP_SHARED_SOURCE_TEST
    public_path_rerun_id: RUN-READER-PAGE-GROUP-SYMMETRY-20260917
    state: verified
  - id: DEF-READER-PAGE-SCREENSHOT-DEDUP-20260917
    acceptance_id: REQ-CONTENT-CORRESPONDENCE
    user_symptom: "同一物理页被多个证据卡重复截图，跨页卡还可能再次插入页级截图；同一页组的一侧新版截图也可能缺失。"
    discovered_via: user_counterexample
    failure_mechanism: "页面组只按章节起始页组织，未使用卡片实际覆盖的全部物理页；页级兜底没有全报告可见页账本，导致重复嵌入或单侧缺图。"
    red_green_pair_id: PAIR-READER-PAGE-SCREENSHOT-DEDUP
    regression_test_id: READER_PAGE_SCREENSHOT_DEDUP_TEST
    public_path_rerun_id: RUN-READER-PAGE-SCREENSHOT-DEDUP-20260917
    state: verified
  - id: DEF-READER-SCREENSHOT-OMISSION-20260916
    acceptance_id: REQ-CONTENT-CORRESPONDENCE
    user_symptom: "正文或表格截图复用时，当前差异项一侧只显示‘已在其他变化项展示’，无法直接左右核对原始截图。"
    discovered_via: user_counterexample
    failure_mechanism: "页面级来源别名只保留了 canonical occurrence 的图片，复用 occurrence 被渲染成空 figure/文字占位；页组存在其他图片时也不会补充缺失的一侧。"
    red_green_pair_id: PAIR-READER-DIRECT-SOURCE-IMAGE
    regression_test_id: READER_DIRECT_SOURCE_IMAGE_TEST
    public_path_rerun_id: RUN-READER-DIRECT-SOURCE-20260916
    state: verified
  - id: DEF-READER-RUNNING-MASTHEAD-20260916
    acceptance_id: REQ-CONTENT-CORRESPONDENCE
    user_symptom: "版本型运行页眉（坐标证据）被作为读者差异卡展示，挤占重点内容。"
    discovered_via: user_counterexample
    failure_mechanism: "页眉识别在两版抽取粒度不一致时降级为 technical，读者投影没有区分出版物页眉与可能含技术标识的动态页眉。"
    red_green_pair_id: PAIR-READER-RUNNING-MASTHEAD
    regression_test_id: READER_RUNNING_MASTHEAD_TEST
    public_path_rerun_id: RUN-READER-FINAL-20260916
    state: verified
  - id: DEF-TABLE-CONTENT-SIMILARITY-20260916
    acceptance_id: REQ-CONTENT-CORRESPONDENCE
    user_symptom: "表格单元格文字已经变化，但页面只显示 1.000，相似度折叠会隐藏重要信息。"
    discovered_via: user_counterexample
    failure_mechanism: "表题/行身份配对分数与单元格内容分数共用一个字段；配对分数忽略值变化，无法作为折叠依据。"
    red_green_pair_id: PAIR-TABLE-CONTENT-SIMILARITY
    regression_test_id: TABLE_CONTENT_SIMILARITY_TEST
    public_path_rerun_id: RUN-READER-FINAL-20260916
    state: verified
  - id: DEF-READER-SCREENSHOT-JUMP-20260916
    acceptance_id: REQ-CONTENT-CORRESPONDENCE
    user_symptom: "跳转到已展示截图不便比较，读者需要离开当前差异项寻找另一侧原图。"
    discovered_via: user_usability_review
    failure_mechanism: "截图去重后的复用 occurrence 只渲染锚点和跳转链接，没有在当前页组提供左右视觉证据。"
    red_green_pair_id: PAIR-READER-SCREENSHOT-SIDE-BY-SIDE
    regression_test_id: PAGE_EVIDENCE_SOURCE_PAIR_TEST
    public_path_rerun_id: RUN-READER-FINAL-20260916
    state: verified
  - id: DEF-TABLE-SIMILARITY-FOLD-20260915
    acceptance_id: REQ-CONTENT-CORRESPONDENCE
    user_symptom: "表格符号或数值已经发生变化，但表格配对相似度显示为 1.000 并被折叠，主差异区看不到。"
    discovered_via: user_counterexample
    failure_mechanism: "表格配对分数按表题和行身份计算并主动忽略单元格值；展示层却把所有 1.000 配对直接移入折叠附录，没有检查行级实质变化。"
    red_green_pair_id: PAIR-TABLE-SIMILARITY-FOLD
    regression_test_id: TABLE_SIMILARITY_FOLD_TEST
    public_path_rerun_id: RUN-TABLE-SIMILARITY-FOLD-20260915
    state: verified
