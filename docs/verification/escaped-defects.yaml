    acceptance_id: REQ-PAGE-WINDOW-CONTENT-FIDELITY
    user_symptom: "A copyright and draft-footer layout change could appear as a confirmed body edit because the legal notice's word 'is' triggered the technical-fact guard."
    discovered_via: cross_style_corpus_expansion
    failure_mechanism: "The footer guard treated the copula in a narrowly recognized legal draft notice as a technical statement. Only those legal copulas are now exempt; units, thresholds, and normative facts stay fail-open."
