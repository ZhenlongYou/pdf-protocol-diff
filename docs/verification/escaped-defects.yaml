  - id: DEF-PAGE-WINDOW-SINGLE-PAGE-GRAY-GUTTER-20260925
    acceptance_id: REQ-PAGE-WINDOW-CONTENT-FIDELITY
    user_symptom: "A one-page comparison could treat light-gray printed line numbers as protocol text when an edition moved the gutter to the opposite page edge."
    discovered_via: cross_style_corpus_expansion
    failure_mechanism: "The existing document-level line-grid gate required three selected pages. Single-page windows now need a near-complete geometric reset grid plus repeated gray-number/dark-body contrast; black numbered lists remain fail-open."
    red_green_pair_id: PAIR-SINGLE-PAGE-GRAY-GUTTER
    regression_test_id: SINGLE_PAGE_GRAY_GRID_STYLE_CONTRAST_TEST
