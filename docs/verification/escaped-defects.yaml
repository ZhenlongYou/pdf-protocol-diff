    failure_mechanism: "页面级来源别名只保留了 canonical occurrence 的图片，复用 occurrence 被渲染成空 figure/文字占位；页组存在其他图片时也不会补充缺失的一侧。"
    red_green_pair_id: PAIR-READER-DIRECT-SOURCE-IMAGE
