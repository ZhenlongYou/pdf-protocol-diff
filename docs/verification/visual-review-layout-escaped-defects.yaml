schema_version: 1
scope_statement: "Visual-review reports retain full horizontal context and never enlarge evidence beyond intrinsic width."
escaped_defects:
  - id: DEF-VISUAL-REVIEW-SCALE-002
    acceptance_id: REQ-VISUAL-REVIEW-SCALE-002
    user_symptom: "Visual-review source crops and the difference mask were enlarged until table text appeared abnormally huge."
    discovered_via: user_counterexample
    failure_mechanism: "The shared table-shot rule forced every image to width 100%, including small visual-only evidence crops."
    red_green_pair_id: PAIR-VISUAL-REVIEW-SCALE-002
    regression_test_id: VISUAL_REVIEW_LAYOUT_TEST
    public_path_rerun_id: RUN-VISUAL-REVIEW-REAL
    state: verified
  - id: DEF-VISUAL-REVIEW-CROP-003
    acceptance_id: REQ-VISUAL-REVIEW-CROP-003
    user_symptom: "A table change in a right-side value column produced a partial screenshot with the left-side row context missing."
    discovered_via: user_counterexample
    failure_mechanism: "The visual watchdog expanded the changed-pixel union box on both axes, so right-side changes cropped away the table's left columns."
    red_green_pair_id: PAIR-VISUAL-REVIEW-CROP-003
    regression_test_id: VISUAL_REVIEW_LAYOUT_TEST
    public_path_rerun_id: RUN-VISUAL-REVIEW-REAL
    state: verified
