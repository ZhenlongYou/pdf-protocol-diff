<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'">
  <title>Protocol Comparison Tool</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --soft: #aaa8be;
      --muted: #858197;
      --line: rgba(231, 228, 255, .16);
      --line-strong: rgba(231, 228, 255, .28);
      --glass: rgba(255, 255, 255, .055);
      --glass-strong: rgba(255, 255, 255, .085);
      --violet: #8273ff;
      --pink: #ef75bd;
      --cyan: #8bdef8;
      --bg: #17182b;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
      --ease-in-out: cubic-bezier(.77, 0, .175, 1);
      --motion-fast: 140ms;
      --motion-standard: 190ms;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      background: #11121f;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    button, input { font: inherit; }
    button { color: inherit; appearance: none; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
    button:disabled { cursor: default; }
    .app {
      height: 100%; padding: 26px 30px 22px; display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px;
      position: relative; overflow: hidden;
      background:
        radial-gradient(620px 360px at 31% 5%, rgba(133, 102, 216, .30), transparent 70%),
        radial-gradient(520px 340px at 83% 72%, rgba(61, 89, 178, .16), transparent 70%),
        linear-gradient(135deg, #18192d 0%, #20213a 54%, #111322 100%);
    }
    .app::before {
      content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: rgba(7, 8, 20, .46); opacity: 0;
      transition: opacity var(--motion-standard) var(--ease-out);
    }
    .app::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .014) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .34), transparent 70%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .34), transparent 70%);
    }
    .app.dialog-open::before { opacity: 1; }
    .head, .stage, .foot, .status { position: relative; z-index: 1; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .mark { position: relative; width: 38px; height: 40px; flex: 0 0 auto; }
    .mark i { position: absolute; width: 24px; height: 29px; border-radius: 7px; transform: rotate(-4deg); }
    .mark i:first-child { left: 2px; top: 2px; background: linear-gradient(150deg, #9a86ff, #6f62e7); }
    .mark i:last-child { right: 1px; bottom: 1px; background: linear-gradient(150deg, #ff94cf, #e660ae); transform: rotate(4deg); }
    .brand-copy { min-width: 0; display: grid; gap: 2px; }
    .brand-kicker, .card-kicker {
      color: var(--soft); font-size: 10px; line-height: 1.2;
      letter-spacing: .10em; text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 25px; line-height: 1.12; letter-spacing: -.025em; }
    .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.3; }
    .local-note { display: flex; align-items: center; gap: 7px; color: var(--soft); font-size: 11px; white-space: nowrap; }
    .local-note i { width: 7px; height: 7px; border-radius: 50%; background: #77e1bf; box-shadow: 0 0 0 4px rgba(119, 225, 191, .10); }
    .stage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; min-height: 0; }
    .card {
      min-width: 0; padding: 20px 22px 18px; display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 14px;
      border: 1px solid var(--line); border-radius: 23px;
      background: linear-gradient(145deg, var(--glass-strong), rgba(255, 255, 255, .035));
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 22px 58px rgba(3, 4, 16, .18);
    }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .card h2 { margin: 2px 0 0; font-size: 20px; line-height: 1.2; letter-spacing: -.025em; }
    .card-index { color: rgba(235, 232, 255, .38); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
    .drop {
      min-height: 0; border: 1px dashed rgba(225, 221, 255, .24); border-radius: 19px;
      background: rgba(17, 18, 36, .36); position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      cursor: pointer; outline: none; isolation: isolate;
      transition: transform var(--motion-standard) var(--ease-out), border-color var(--motion-standard) ease, background-color var(--motion-standard) ease, box-shadow var(--motion-standard) ease;
    }
    .drop::before {
      content: ""; position: absolute; width: 260px; height: 180px; border-radius: 50%;
      filter: blur(55px); opacity: .23;
      z-index: -1;
    }
    .old .drop::before { background: var(--violet); }
    .new .drop::before { background: var(--pink); }
    .drop:focus-visible { border-color: rgba(139, 222, 248, .82); box-shadow: 0 0 0 4px rgba(139, 222, 248, .12); }
    .drop.has-file { border-color: rgba(139, 222, 248, .54); background: rgba(25, 27, 52, .52); }
    .file-glyph {
      width: 76px; height: 94px; border-radius: 20px; position: relative;
      box-shadow: 0 16px 30px rgba(0, 0, 0, .25);
      transition: transform var(--motion-standard) var(--ease-out), opacity var(--motion-standard) var(--ease-out);
    }
    .old .file-glyph { background: linear-gradient(145deg, #9a89ff, #6759dc); }
    .new .file-glyph { background: linear-gradient(145deg, #ff96d1, #d958a6); }
    .file-glyph::before {
      content: ""; position: absolute; top: 0; right: 0; width: 25px; height: 25px;
      background: rgba(255, 255, 255, .72); clip-path: polygon(0 0, 100% 100%, 0 100%); border-radius: 0 18px 0 0;
    }
    .file-glyph::after {
      content: ""; position: absolute; left: 22px; top: 42px; width: 32px; height: 20px;
      border-top: 3px solid white; border-bottom: 3px solid white; opacity: .9;
    }
    .drop-copy { display: grid; justify-items: center; gap: 3px; max-width: 82%; min-width: 0; }
    .drop strong { font-size: 15px; line-height: 1.3; position: relative; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drop small { color: #9f9bb1; font-size: 11px; line-height: 1.3; position: relative; }
    .drop.has-file .file-glyph { transform: translateY(-2px); }
    .drop.has-file .drop-copy strong { color: #ffffff; }
    .drop-arrow { position: absolute; right: 16px; bottom: 14px; color: rgba(235, 232, 255, .42); font-size: 16px; line-height: 1; transform: rotate(-45deg); }
    .page-controls { display: flex; align-items: center; gap: 8px; }
    .chip, .page-chip {
      border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .055);
      color: #d1cede; border-radius: 16px; padding: 8px 13px; font-size: 11px;
      white-space: nowrap; transition: transform var(--motion-fast) var(--ease-out), opacity var(--motion-fast) var(--ease-out), border-color var(--motion-fast) ease, background-color var(--motion-fast) ease;
    }
    button.chip, .page-chip { cursor: pointer; }
    .page-chip.active { border-color: rgba(139, 222, 248, .68); background: rgba(74, 123, 153, .26); color: var(--ink); }
    .chip:active, .page-chip:active { transform: scale(.97); }
    .page-chip:disabled, .chip:disabled { opacity: .56; }
    .range { display: none; align-items: center; gap: 8px; }
    .range.visible { display: flex; }
    .range label { color: var(--soft); font-size: 11px; }
    .range input, .advanced input[type="text"] {
      height: 32px; width: 72px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(12, 13, 27, .66); color: var(--ink); outline: none; padding: 0 10px;
    }
    .range input:focus, .advanced input:focus { border-color: var(--cyan); }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 52px; }
    .settings, .actions { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .settings-note { color: var(--muted); font-size: 11px; white-space: nowrap; }
    #advanced-toggle { cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
    .settings-arrow { color: var(--cyan); font-size: 14px; line-height: 1; transform: translateY(-1px); }
    .run-state { display: none; align-items: center; gap: 10px; margin-right: 8px; }
    .app.running .run-state { display: flex; }
    .run-state span { color: #d5d2e2; font-size: 12px; white-space: nowrap; }
    .run-track { width: 170px; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .10); overflow: hidden; }
    .run-track i {
      display: block; width: 42%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, transparent, #8ddff9 40%, #a084ff 75%, transparent);
      animation: run-slide 1.25s linear infinite;
    }
    @keyframes run-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(250%); } }
    .primary {
      height: 46px; min-width: 126px; padding: 0 24px; border: 0; border-radius: 15px;
      background: linear-gradient(110deg, #8edff8, #9c83ff); color: #15182a; font-weight: 700;
      box-shadow: 0 14px 35px rgba(115, 189, 246, .24); cursor: pointer;
      transition: transform var(--motion-fast) var(--ease-out), opacity var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) ease;
    }
    .primary:active { transform: scale(.97); }
    .primary:disabled { opacity: .70; box-shadow: none; cursor: default; }
    .result-actions { display: none; gap: 8px; }
    .app.success .result-actions { display: flex; }
    .status {
      position: absolute; left: 30px; bottom: 7px; z-index: 2; color: var(--soft); font-size: 11px;
      max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .advanced {
      visibility: hidden; opacity: 0; pointer-events: none; position: absolute; inset: 84px 30px 74px; z-index: 5; padding: 22px;
      border: 1px solid var(--line); border-radius: 24px; background: rgba(24, 25, 45, .96);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .42);
      transform: translateY(-8px) scale(.985);
      transition: opacity var(--motion-standard) var(--ease-out), transform var(--motion-standard) var(--ease-out), visibility 0s linear var(--motion-standard);
    }
    .advanced.visible { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); transition-delay: 0s; }
    .advanced-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .advanced h3 { margin: 0; font-size: 17px; }
    .advanced-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field span, .check span { color: var(--soft); font-size: 11px; }
    .field input[type="text"] { width: 100%; }
    .path-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .check { display: flex; align-items: center; gap: 8px; }
    .close { border: 0; background: transparent; color: var(--soft); cursor: pointer; font-size: 20px; line-height: 1; transition: transform var(--motion-fast) var(--ease-out), color var(--motion-fast) ease; }
    @media (max-width: 899px) {
      html, body { overflow: hidden; }
      .app { padding: 20px 20px 18px; gap: 12px; }
      .local-note, .settings-note { display: none; }
      .stage { grid-template-columns: 1fr; gap: 14px; overflow-y: auto; padding-right: 4px; }
      .card { min-height: 380px; }
      .status { left: 20px; }
      .run-track { width: 110px; }
      .advanced { inset: 66px 20px 68px; overflow-y: auto; }
      .advanced-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media (hover: hover) and (pointer: fine) {
      .drop:hover { transform: translateY(-2px); border-color: rgba(139, 222, 248, .72); background: rgba(25, 27, 52, .56); box-shadow: 0 14px 34px rgba(6, 8, 26, .16); }
      .chip:hover, .page-chip:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, .09); }
      .primary:hover { transform: translateY(-1px); box-shadow: 0 17px 38px rgba(115, 189, 246, .30); }
      .close:hover { color: var(--ink); transform: scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .run-track i { animation: none; transform: translateX(70%); }
      .drop, .file-glyph, .chip, .page-chip, .primary, .advanced, .close { transition-duration: 1ms; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .card, .advanced { background: rgba(24, 25, 45, .98); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    @media (prefers-contrast: more) {
      .card, .advanced { border-color: rgba(255, 255, 255, .40); }
      .drop { border-color: rgba(255, 255, 255, .48); }
    }
  </style>
</head>
<body>
  <main id="app" class="app">
    <header class="head">
      <div class="brand">
        <div class="mark" aria-hidden="true"><i></i><i></i></div>
        <div class="brand-copy">
          <span class="brand-kicker">Protocol Comparison Tool</span>
          <h1>协议 PDF 对比</h1>
          <p class="subtitle">按页核对版本变化，报告保留原始文件名</p>
        </div>
      </div>
      <div class="local-note" aria-label="本机处理"><i aria-hidden="true"></i><span>在本机处理</span></div>
    </header>
    <section class="stage">
      <article class="card old" data-side="old">
        <div class="card-head">
          <div><span class="card-kicker">基准文件</span><h2>旧版 PDF</h2></div>
          <span class="card-index" aria-hidden="true">01</span>
        </div>
        <button class="drop" type="button" data-choose="old" aria-label="选择旧版 PDF">
          <span class="file-glyph" aria-hidden="true"></span>
          <span class="drop-copy"><strong id="old-name">选择旧版 PDF</strong><small>点击选择文件</small></span>
          <span class="drop-arrow" aria-hidden="true">↗</span>
        </button>
        <div class="page-controls">
          <button class="page-chip active" type="button" data-mode="old:all" aria-pressed="true">全部页面</button>
          <button class="page-chip" type="button" data-mode="old:range" aria-pressed="false">选择页面</button>
        </div>
        <div id="old-range" class="range">
          <label for="old-start">起始页</label><input id="old-start" inputmode="numeric">
          <label for="old-end">终止页</label><input id="old-end" inputmode="numeric">
        </div>
      </article>
      <article class="card new" data-side="new">
        <div class="card-head">
          <div><span class="card-kicker">目标文件</span><h2>新版 PDF</h2></div>
          <span class="card-index" aria-hidden="true">02</span>
        </div>
        <button class="drop" type="button" data-choose="new" aria-label="选择新版 PDF">
          <span class="file-glyph" aria-hidden="true"></span>
          <span class="drop-copy"><strong id="new-name">选择新版 PDF</strong><small>点击选择文件</small></span>
          <span class="drop-arrow" aria-hidden="true">↗</span>
        </button>
        <div class="page-controls">
          <button class="page-chip active" type="button" data-mode="new:all" aria-pressed="true">全部页面</button>
          <button class="page-chip" type="button" data-mode="new:range" aria-pressed="false">选择页面</button>
        </div>
        <div id="new-range" class="range">
          <label for="new-start">起始页</label><input id="new-start" inputmode="numeric">
          <label for="new-end">终止页</label><input id="new-end" inputmode="numeric">
        </div>
      </article>
    </section>
    <footer class="foot">
      <div class="settings">
        <button id="advanced-toggle" class="chip" type="button" aria-controls="advanced" aria-expanded="false"><span>报告设置</span><span class="settings-arrow" aria-hidden="true">↗</span></button>
        <span class="settings-note">比较策略自动保持一致</span>
      </div>
      <div class="actions">
        <div class="run-state" role="status"><span id="running-label">正在比较</span><div class="run-track"><i></i></div></div>
        <div class="result-actions"><button id="open-report" class="chip" type="button">打开 HTML 报告</button><button id="open-dir" class="chip" type="button">打开输出目录</button></div>
        <button id="cancel" class="chip" type="button" hidden>终止比较</button>
        <button id="start" class="primary" type="button">开始比较</button>
      </div>
    </footer>
    <div id="status" class="status" aria-live="polite"></div>
    <section id="advanced" class="advanced" role="dialog" aria-modal="true" aria-labelledby="advanced-title" aria-hidden="true">
      <div class="advanced-head"><div><span class="card-kicker">输出</span><h3 id="advanced-title">报告设置</h3></div><button id="advanced-close" class="close" type="button" aria-label="关闭">×</button></div>
      <div class="advanced-grid">
        <label class="field full"><span>输出目录</span><span class="path-row"><input id="output-dir" type="text"><button id="choose-output" class="chip" type="button">选择</button></span></label>
        <label class="check"><input id="auto-open" type="checkbox"><span>完成后自动打开报告</span></label>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const state = { old_pdf: "", new_pdf: "", old_mode: "all", new_mode: "all", running: false };
      const app = document.querySelector("#app");
      const status = document.querySelector("#status");
      const start = document.querySelector("#start");
      const cancel = document.querySelector("#cancel");
      let stateRevision = -1;
      let polling = false;
      let runGeneration = 0;
      const runningLabel = document.querySelector("#running-label");
      const stageNames = { starting: "准备比较", read_old_scan: "预扫描旧版", read_new_scan: "预扫描新版", sectioning: "构建章节", match_exact: "匹配章节", match_fallback: "匹配剩余章节", match_rescue: "核对章节对应关系", match_rescue_body: "核对正文对应关系", compare_text: "比较正文差异", read_old: "读取旧版", read_new: "读取新版", match_diff: "匹配差异", visual_evidence: "生成视觉证据", report: "生成报告" };
      let timer = null;
      let startedAt = 0;
      let focusBeforeDialog = null;
      const internalConfig = Object.freeze({ min_similarity: "0.72", max_snippets: "20", include_unchanged: false });

      function invalidateResult(message = "输入已修改，请重新比较") {
        if (state.running) return;
        app.classList.remove("success");
        status.textContent = message;
      }

      function setMode(side, mode) {
        const previous = state[`${side}_mode`];
        state[`${side}_mode`] = mode;
        document.querySelectorAll(`[data-mode^="${side}:"]`).forEach(button => {
          const active = button.dataset.mode.endsWith(`:${mode}`);
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        document.querySelector(`#${side}-range`).classList.toggle("visible", mode === "range");
        if (previous !== mode) invalidateResult();
      }
      function setRunning(running) {
        state.running = running; app.classList.toggle("running", running);
        start.disabled = running; start.textContent = running ? "比较中" : "开始比较";
        cancel.hidden = !running; cancel.disabled = false; cancel.textContent = "终止比较";
        document.querySelectorAll("button, input").forEach(control => { if (control !== start && control !== cancel) control.disabled = running; });
        clearInterval(timer); timer = null;
        if (running) {
          startedAt = Date.now();
          const updateElapsed = () => { const seconds = Math.floor((Date.now() - startedAt) / 1000); runningLabel.textContent = `正在比较 ${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`; };
          updateElapsed(); timer = setInterval(updateElapsed, 1000);
        }
      }
      function config() {
        return {
          old_pdf: state.old_pdf, new_pdf: state.new_pdf,
          old_mode: state.old_mode, new_mode: state.new_mode,
          old_start: document.querySelector("#old-start").value, old_end: document.querySelector("#old-end").value,
          new_start: document.querySelector("#new-start").value, new_end: document.querySelector("#new-end").value,
          output_dir: document.querySelector("#output-dir").value,
          min_similarity: internalConfig.min_similarity,
          max_snippets: internalConfig.max_snippets,
          include_unchanged: internalConfig.include_unchanged,
          auto_open: document.querySelector("#auto-open").checked,
        };
      }
      async function choosePdf(side) {
        try {
          const response = await window.pywebview.api.choose_pdf(side);
          if (!response.ok) { status.textContent = response.error || "无法选择 PDF。"; return; }
          if (response.cancelled) return;
          state[`${side}_pdf`] = response.path;
          const drop = document.querySelector(`[data-choose="${side}"]`);
          document.querySelector(`#${side}-name`).textContent = response.name;
          if (drop) {
            drop.classList.add("has-file");
            const hint = drop.querySelector("small");
            if (hint) hint.textContent = "点击更换文件";
          }
          invalidateResult();
        } catch (_error) { status.textContent = "无法打开文件选择窗口。"; }
      }
      window.protocolDiff = {
        receive(payload) {
          if (payload.type === "running") { setRunning(true); status.textContent = "正在比较"; app.classList.remove("success"); }
          if (payload.type === "progress") {
            const stage = stageNames[payload.stage] || payload.stage;
            status.textContent = payload.completed_pages != null ? `${stage} · ${payload.completed_pages}/${payload.total_pages} ${payload.unit || "页"}` : stage;
          }
          if (payload.type === "success") {
            setRunning(false); app.classList.add("success");
            const counts = payload.counts;
            const summary = counts ? `${payload.reliability} · 正文 ${counts.body} · Table ${counts.table} · 视觉 ${counts.visual}` : `${payload.reliability} · 统计请查看报告`;
            status.textContent = payload.notice || summary;
          }
          if (payload.type === "cancelling") { cancel.disabled = true; cancel.textContent = "正在停止"; status.textContent = payload.message; }
          if (payload.type === "cleanup_error") { cancel.disabled = false; cancel.textContent = "重试终止"; status.textContent = payload.message; }
          if (payload.type === "cancelled") { setRunning(false); app.classList.remove("success"); status.textContent = payload.message; }
          if (payload.type === "error") { setRunning(false); app.classList.remove("success"); status.textContent = payload.message; }
          if (payload.type === "notice") { status.textContent = payload.message; }
        }
      };
      cancel.addEventListener("click", async () => {
        cancel.disabled = true; cancel.textContent = "正在停止";
        try {
          const response = await window.pywebview.api.cancel_comparison();
          if (!response.ok) { status.textContent = response.error; cancel.disabled = false; cancel.textContent = "重试终止"; }
        } catch (_error) { status.textContent = "未能请求终止，请重试。"; cancel.disabled = false; cancel.textContent = "重试终止"; }
      });
      // Only one poll is in flight. A stalled JS renderer cannot block the
      // Python supervisor's cancellation or process-tree cleanup.
      setInterval(async () => {
        if (!state.running || polling || !window.pywebview) return;
        polling = true;
        const generation = runGeneration;
        try {
          const payload = await window.pywebview.api.get_run_state();
          if (generation === runGeneration && payload.revision > stateRevision) {
            stateRevision = payload.revision;
            window.protocolDiff.receive(payload);
          }
        } catch (_error) { status.textContent = "暂时无法读取进度，可重试终止操作。"; }
        finally { polling = false; }
      }, 250);
      document.querySelectorAll("[data-choose]").forEach(button => button.addEventListener("click", () => choosePdf(button.dataset.choose)));
      document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => { const [side, mode] = button.dataset.mode.split(":"); setMode(side, mode); }));
      function setAdvanced(open) {
        const dialog = document.querySelector("#advanced");
        document.querySelectorAll(".head, .stage, .foot, #status").forEach(region => { region.inert = open; });
        dialog.classList.toggle("visible", open);
        app.classList.toggle("dialog-open", open);
        dialog.setAttribute("aria-hidden", String(!open));
        document.querySelector("#advanced-toggle").setAttribute("aria-expanded", String(open));
        if (open) { focusBeforeDialog = document.activeElement; document.querySelector("#advanced-close").focus(); }
        else if (focusBeforeDialog) focusBeforeDialog.focus();
      }
      document.querySelector("#advanced-toggle").addEventListener("click", () => setAdvanced(true));
      document.querySelector("#advanced-close").addEventListener("click", () => setAdvanced(false));
      document.addEventListener("keydown", event => {
        const dialog = document.querySelector("#advanced");
        if (!dialog.classList.contains("visible")) return;
        if (event.key === "Escape") { setAdvanced(false); return; }
        if (event.key !== "Tab") return;
        const focusable = [...dialog.querySelectorAll("button:not([disabled]), input:not([disabled])")];
        if (!focusable.length) return;
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
      document.querySelector("#choose-output").addEventListener("click", async () => {
        try {
          const response = await window.pywebview.api.choose_output_dir();
          if (!response.ok) { status.textContent = response.error || "无法选择输出目录。"; return; }
          if (!response.cancelled) {
            document.querySelector("#output-dir").value = response.path;
            invalidateResult();
          }
        } catch (_error) { status.textContent = "无法打开目录选择窗口。"; }
      });
      document.querySelectorAll(".range input").forEach(input => input.addEventListener("input", () => invalidateResult()));
      document.querySelector("#output-dir").addEventListener("input", () => invalidateResult());
      document.querySelector("#start").addEventListener("click", async () => {
        if (state.running) return;
        runGeneration += 1;
        setRunning(true); status.textContent = "正在比较";
        try {
          const response = await window.pywebview.api.run_comparison(config());
          if (!response.ok) { setRunning(false); app.classList.remove("success"); status.textContent = response.error; }
        } catch (_error) {
          setRunning(false); app.classList.remove("success"); status.textContent = "无法启动比较，请重新运行。";
        }
      });
      async function openResult(method) {
        try {
          const response = await window.pywebview.api[method]();
          if (!response.ok) status.textContent = response.error || "无法打开，请检查文件是否仍然存在。";
        } catch (_error) { status.textContent = "无法打开，请检查文件是否仍然存在。"; }
      }
      document.querySelector("#open-report").addEventListener("click", () => openResult("open_html_report"));
      document.querySelector("#open-dir").addEventListener("click", () => openResult("open_output_dir"));
      window.addEventListener("pywebviewready", async () => {
        try {
          const defaults = await window.pywebview.api.get_defaults();
          document.querySelector("#output-dir").value = defaults.output_dir;
        } catch (_error) { status.textContent = "无法读取默认设置。"; }
      });
    })();
  </script>
</body>
</html>
